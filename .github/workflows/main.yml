name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          unzip -o "**/*.zip" -d. || true
          G=$(find. -name gradlew | head -n1)
          chmod +x $G
          cd $(dirname $G) &&./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: "**/*.aab"
